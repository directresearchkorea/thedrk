  <text x="540" y="192" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Qual + Quant + Vector RAG</text>

  <!-- Report Document Mock -->
  <rect x="540" y="210" width="180" height="160" rx="8" fill="#0f172a" stroke="#334155"/>
  <rect x="554" y="224" width="90" height="8" rx="4" fill="#f59e0b"/>
  <rect x="554" y="240" width="150" height="6" rx="3" fill="#475569"/>
  <rect x="554" y="252" width="135" height="6" rx="3" fill="#475569"/>
  <rect x="554" y="272" width="75" height="8" rx="4" fill="#6366f1"/>
  <rect x="554" y="288" width="145" height="6" rx="3" fill="#475569"/>
  <rect x="554" y="300" width="125" height="6" rx="3" fill="#475569"/>
  <rect x="554" y="322" width="152" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="630" y="343" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fcd34d" text-anchor="middle">2021–2026 Vector DB Grounded</text>

