  <text x="120" y="228" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">Choi Yuna (32F · PM)</text>
  <text x="120" y="243" font-family="Arial, sans-serif" font-size="10" fill="#34d399">SEC B · KRW 68M/yr</text>

