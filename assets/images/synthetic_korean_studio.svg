  <text x="120" y="297" font-family="Arial, sans-serif" font-size="10" fill="#34d399">SEC A · KRW 110M/yr</text>

  <rect x="80" y="320" width="180" height="50" rx="8" fill="#312e81" opacity="0.5"/>
